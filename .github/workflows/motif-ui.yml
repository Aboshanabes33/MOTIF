name: Motif UI

# Fast gate for the Motif settings surfaces: component, flow, and composition
# specs for ui-motif plus the bundle-composition checks. Runs on every push
# and pull request so a dead button, a dropped slot, or an inconsistent
# provider row fails here with the spec name instead of reaching the browser.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  motif-ui:
    runs-on: ubuntu-latest
    name: motif-ui
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Vitest prints the failing spec, the rendered copy key, and the call
      # counts, which is the actionable failure report.
      - name: Motif surface and composition tests
        run: >-
          pnpm exec vitest run
          packages/client/ui-motif/tests
          packages/bundle/web-app/tests/motif-bundle.spec.ts

# Relay composition over the shipped headless profile: a stand-in backend
# returns only a final answer, and the relay route is the configured model.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: motif-relay
        model: claude-code
        cwd: !!js process.env.MOTIF_RELAY_BRAND

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'

- insert:
    - id: motif-relay-stand-in
      name: './stand-in.ts'
      config:
        providerName: claude-code
        answer: !!js process.env.MOTIF_RELAY_STAND_IN_ANSWER ?? 'Trimmed the intro to four seconds.'
        failCategory: !!js process.env.MOTIF_RELAY_STAND_IN_FAILURE ?? ''

    - id: motif-relay
      name: '@deepseek-ai/dsh-llm-motif-relay'
      config:
        backend: claude-code
        model: claude-code
        displayName: Claude Code
        timeoutMs: 60000

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

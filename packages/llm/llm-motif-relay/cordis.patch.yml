# The Motif relay bundle layer. Enabling the bundle in the Plugins page is what
# puts `Claude Code (relay)` and `Codex (relay)` in the model selector: one
# provider row per command-line agent, and one relay route over each. A provider
# starts no native process until a Session sends a message, so the layer stays
# dormant while its routes are unselected.
#
# Two routes, not two bundles: the relay is the same package in both, and the
# only difference is the backend name it delegates to. Each route registers its
# own name on `ctx.llm` (the default `motif-relay` cannot be shared), advertises
# its own models, and labels itself after that backend. Choosing one is the
# user's backend choice; choosing a model inside it is the user's model choice.
# Nothing switches automatically, and a missing `claude login` or `codex login`
# fails with that agent's instruction.
#
# Claude Code is offered through three provider instances, one per native model
# alias. The relay route maps each advertised model id to its provider row, so
# the selector lists real choices while every provider still pins its own
# native model. Codex stays on its native default because its model catalogue is
# deployment-owned; add a provider row and a `models` entry to expose more.
#
# A deployment that wants only one backend deletes the other pair of rows here
# or in its own profile patch, addressed by id.
- insert:
    # The one-shot Claude Code providers the first route delegates to. Each row
    # carries one native model alias; the route never changes it at send time.
    - id: motif-relay-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
    - id: motif-relay-claude-sonnet
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        model: sonnet
    - id: motif-relay-claude-opus
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        model: opus
    - id: motif-relay-claude-haiku
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        model: haiku

    # The one-shot Codex provider the second route delegates to.
    - id: motif-relay-codex-provider
      name: '@deepseek-ai/dsh-subagent-codex'

    # Route one: every send is one fresh Claude Code run in the Brand folder.
    - id: motif-relay
      name: '@deepseek-ai/dsh-llm-motif-relay'
      config:
        providerName: motif-relay-claude-code
        backend: claude-code
        displayName: Claude Code
        model: sonnet
        models:
          - id: sonnet
            provider: motif-relay-claude-sonnet
            name: Claude Sonnet
            description: Balanced speed and depth for everyday edits.
            backend: claude-code
          - id: opus
            provider: motif-relay-claude-opus
            name: Claude Opus
            description: Deepest reasoning for complex edits.
            backend: claude-code
          - id: haiku
            provider: motif-relay-claude-haiku
            name: Claude Haiku
            description: Fastest, for small changes and quick checks.
            backend: claude-code

    # Route two: every send is one fresh Codex thread in the Brand folder.
    - id: motif-relay-codex
      name: '@deepseek-ai/dsh-llm-motif-relay'
      config:
        providerName: motif-relay-codex
        backend: codex
        displayName: Codex
        model: codex
        models:
          - id: codex
            provider: motif-relay-codex-provider
            name: Codex
            description: Uses the model selected in your native Codex configuration.
            backend: codex
